<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SACO list converter - Convert Excel files to HTML format">
    <title>SACO list converter</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-top: 20px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 600px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        .language-selector {
            margin-bottom: 25px;
        }

        .language-selector .btn {
            margin-right: 10px;
        }

        .btn.active {
            font-weight: bold;
        }
        
        /* Accessibility improvements */
        :focus {
            outline: 3px solid #4A90E2;
            outline-offset: 2px;
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        
        /* Ensure sufficient color contrast */
        .btn-light {
            color: #2C2C2C;
            background-color: #F8F9FA;
        }
        
        .btn-light:hover {
            background-color: #E2E6EA;
        }
        
        /* Status message styling */
        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        
        .status-message.success {
            background-color: #DFF0D8;
            color: #3C763D;
            border: 1px solid #D6E9C6;
        }
    </style>
</head>

<body>

    <main class="container" role="main">
        <h1>SACO list converter</h1>
        
        <div class="language-selector mrgn-bttm-md mrgn-tp-lg" role="group" aria-label="Select output language">
            <button id="btnEnglish" class="btn btn-primary active" aria-pressed="true">
                <span class="visually-hidden">Generate HTML in </span>English
            </button>
            <button id="btnFrench" class="btn btn-light" aria-pressed="false">
                <span class="visually-hidden">Generate HTML in </span>French
            </button>
            <button id="btn-copy-code" class="btn btn-light" aria-label="Copy generated HTML code">
                <i class="bi bi-clipboard" aria-hidden="true"></i> Copy code
            </button>
        </div>

        <div class="file-input-section">
            <label for="upload" class="form-label">Select Excel file to convert:</label>
            <input type="file" id="upload" accept=".xlsx,.xls" class="form-control" aria-describedby="fileHelpText" />
            <div id="fileHelpText" class="form-text">Accepted formats: .xlsx, .xls</div>
        </div>

        <div id="statusMessages" role="status" aria-live="polite" class="status-message"></div>

        <div class="output-section mt-4">
            <label for="output" class="form-label">Generated HTML Code:</label>
            <textarea id="output" readonly class="form-control" aria-describedby="outputHelpText"></textarea>
            <div id="outputHelpText" class="form-text">The generated HTML code will appear here after uploading a file.</div>
        </div>
    </main>

    <script>
        let currentLanguage = 'en';

        function updateLanguageButtons(selectedLang) {
            const engBtn = document.getElementById('btnEnglish');
            const frBtn = document.getElementById('btnFrench');
            
            if (selectedLang === 'en') {
                engBtn.classList.add('active', 'btn-primary');
                engBtn.classList.remove('btn-light');
                engBtn.setAttribute('aria-pressed', 'true');
                frBtn.classList.remove('active', 'btn-primary');
                frBtn.classList.add('btn-light');
                frBtn.setAttribute('aria-pressed', 'false');
                document.documentElement.lang = 'en';
            } else {
                frBtn.classList.add('active', 'btn-primary');
                frBtn.classList.remove('btn-light');
                frBtn.setAttribute('aria-pressed', 'true');
                engBtn.classList.remove('active', 'btn-primary');
                engBtn.classList.add('btn-light');
                engBtn.setAttribute('aria-pressed', 'false');
                document.documentElement.lang = 'fr';
            }
        }

        document.getElementById('btnEnglish').addEventListener('click', function () {
            currentLanguage = 'en';
            updateLanguageButtons('en');
            processFile();
        });

        document.getElementById('btnFrench').addEventListener('click', function () {
            currentLanguage = 'fr';
            updateLanguageButtons('fr');
            processFile();
        });

        // Copies the code in the text area
        document.getElementById("btn-copy-code").addEventListener("click", function() {
            const textarea = document.getElementById("output");
            const statusMsg = document.getElementById("statusMessages");
            textarea.select();
            
            try {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    // Update button state and icon
                    const originalIcon = '<i class="bi bi-clipboard" aria-hidden="true"></i>';
                    const successIcon = '<i class="bi bi-clipboard-check" aria-hidden="true"></i>';
                    const originalText = "Copy code";
                    this.innerHTML = `${successIcon} Copied!`;
                    
                    // Show success message in status area
                    statusMsg.className = "status-message success";
                    statusMsg.textContent = "HTML code copied to clipboard successfully";
                    
                    setTimeout(() => {
                        this.innerHTML = `${originalIcon} ${originalText}`;
                        statusMsg.textContent = "";
                        statusMsg.className = "status-message";
                    }, 2000);
                });
            } catch (err) {
                console.error('Failed to copy text: ', err);
                statusMsg.className = "status-message error";
                statusMsg.textContent = "Failed to copy HTML code to clipboard";
            }
        });

        let lastUploadedFile = null;

        document.getElementById('upload').addEventListener('change', function (e) {
            lastUploadedFile = e.target.files[0];
            processFile();
        });

        function processFile() {
            const file = lastUploadedFile;
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {
                        type: 'array'
                    });

                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, {
                        header: 1
                    });

                    const grouped = {};

                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        const department = currentLanguage === 'en' ? (row[0] || "Unknown Department") : (row[1] || "Ministère inconnu");
                        const acronym = currentLanguage === 'en' ? (row[2] || "") : (row[3] || "");
                        let application = currentLanguage === 'en' ? (row[5] || "Unknown Application") : (row[6] || "Application inconnue");
                        application = application.replace(/\\/g, "/").replace(/\s*\/\s*/g, " / ");

                        const firstName = row[8] || "";
                        const lastName = row[7] || "";
                        const phonePart1 = row[9] || "";
                        const phonePart2 = row[10] || "";
                        const extension = row[11] || "";
                        const cityRaw = row[4] || "";
                        const email = row[12] || "";
                        const notes = row[13] || "";
                        const city = cityRaw.charAt(0).toUpperCase() + cityRaw.slice(1).toLowerCase();

                        const phoneRaw = `${phonePart1}${phonePart2}`;
                        let formattedPhone = phoneRaw;
                        if (/^\d{10}$/.test(phoneRaw)) {
                            formattedPhone = `${phoneRaw.slice(0,3)}-${phoneRaw.slice(3,6)}-${phoneRaw.slice(6)}`;
                        } else if (phonePart1 || phonePart2) {
                            formattedPhone = `${phonePart1}${phonePart1 && phonePart2 ? "-" : ""}${phonePart2}`;
                        }
                        if (extension.trim()) {
                            formattedPhone += `#${extension.trim()}`;
                        }

                        let contactHTML = `                                ${firstName} ${lastName}<br>\n`;
                        if (formattedPhone.trim()) {
                            contactHTML += `                                ${formattedPhone}`;
                            contactHTML += cityRaw.trim() ? `<br>\n` : `\n`;
                        }
                        if (cityRaw.trim()) {
                            contactHTML += `                                <span class="small">${city}</span>\n`;
                        }

                        const contactItem = `                            <li>\n${contactHTML}                            </li>\n`;

                        if (!grouped[department]) grouped[department] = {};
                        if (!grouped[department][application]) {
                            grouped[department][application] = {
                                contacts: [],
                                email: "",
                                notes: ""
                            };
                        }

                        grouped[department][application].contacts.push(contactItem);
                        if (notes && !grouped[department][application].notes) {
                            grouped[department][application].notes = notes.trim();
                        }
                        if (email && !grouped[department][application].email) {
                            grouped[department][application].email = email.trim();
                        }
                    }

                    const uiText = {
                        en: {
                            expandAll: "Expand all",
                            collapseAll: "Collapse all",
                            notes: "Notes",
                            email: "Email",
                            dataTitleOpen: "Expand all sections of content",
                            dataTitleClose: "Collapse all sections of content",
                            titleOpen: "Expand all sections of content",
                            titleClose: "Collapse all sections of content"

                        },
                        fr: {
                            expandAll: "Afficher tout",
                            collapseAll: "Réduire tout",
                            notes: "Notes",
                            email: "Courriel",
                            dataTitleOpen: "Afficher toutes les sections de contenu",                            
                            dataTitleClose: "Réduire toutes les sections de contenu",
                            titleOpen: "Afficher toutes les sections de contenu",
                            titleClose: "Réduire toutes les sections de contenu"
                        }
                    };

                    let html = `
<div class="btn-group pull-right mrgn-bttm-md mrgn-lft-sm">
    <button type="button" class="btn btn-default wb-toggle mrgn-rght-sm" data-toggle="{&quot;selector&quot;: &quot;details&quot;, &quot;parent&quot;: &quot;#saco-list&quot;, &quot;type&quot;: &quot;on&quot;}" data-title-close="${uiText[currentLanguage].dataTitleClose}" data-title-open="${uiText[currentLanguage].dataTitleOpen}" title="${uiText[currentLanguage].titleOpen}">${uiText[currentLanguage].expandAll}</button>
    <button type="button" class="btn btn-default wb-toggle" data-toggle="{&quot;selector&quot;: &quot;details&quot;, &quot;parent&quot;: &quot;#saco-list&quot;, &quot;type&quot;: &quot;off&quot;}" data-title-close="${uiText[currentLanguage].dataTitleClose}" data-title-open="${uiText[currentLanguage].dataTitleOpen}" title="${uiText[currentLanguage].titleClose}">${uiText[currentLanguage].collapseAll}</button>
</div>\n`;

                    html += `<ul class="list-unstyled wb-filter lst-spcd" data-wb-filter="{&quot;selector&quot;:&quot;summary&quot;, &quot;hdnparentuntil&quot;: &quot;ul&quot;}" id="saco-list">\n`;

                    let deptAcronyms = {};
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        const dept = currentLanguage === 'en' ? (row[0] || "") : (row[1] || "");
                        const acronym = currentLanguage === 'en' ? (row[2] || "") : (row[3] || "");
                        if (dept && acronym) {
                            deptAcronyms[dept] = acronym;
                        }
                    }

                    for (const dept in grouped) {
                        const acronym = deptAcronyms[dept] || "";

                        html += `    <li>\n`;
                        html += `        <details class="panel panel-default brdr-0 mrgn-bttm-md">\n`;
                        html += `            <summary class="panel-heading brdr-0"><span class="h4 mrgn-lft-sm">${dept}</span>${acronym ? ` <abbr class="small text-muted"><strong>(${acronym})</strong></abbr>` : ``}</summary>\n`;

                        for (const app in grouped[dept]) {
                            const appData = grouped[dept][app];
                            html += `            <section class="brdr-bttm panel-body">\n`;
                            html += `                <div class="row">\n`;
                            html += `                    <div class="col-xs-12 col-sm-2">\n`;
                            html += `                        <h4 class="h5 mrgn-tp-0">\n`;
                            html += `                            ${app}\n`;
                            html += `                        </h4>\n`;
                            html += `                    </div>\n`;
                            html += `                    <div class="col-xs-12 col-sm-10">\n`;
                            if (appData.notes) {
                                html += `                        <p><strong>${uiText[currentLanguage].notes}:</strong> ${appData.notes}</p>\n`;
                            }
                            if (appData.email) {
                                html += `                        <p><strong>${uiText[currentLanguage].email}:</strong> <a href="mailto:${appData.email}">${appData.email}</a></p>\n`;
                            }
                            html += `                        <ul class="lst-spcd colcount-md-3">\n`;
                            html += appData.contacts.join("");
                            html += `                        </ul>\n`;
                            html += `                    </div>\n`;
                            html += `                </div>\n`;
                            html += `            </section>\n`;
                        }

                        html += `        </details>\n`;
                        html += `    </li>\n`;
                    }

                    html += `</ul>\n`;
                    document.getElementById('output').value = html;

                } catch (err) {
                    document.getElementById('output').value = `Error reading file: ${err.message}`;
                }
            };

            reader.onerror = function () {
                document.getElementById('output').value = "File could not be read.";
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>

</html>
