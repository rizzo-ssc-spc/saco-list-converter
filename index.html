<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SACO List Converter</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 20px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 600px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        .language-selector {
            margin-bottom: 15px;
        }

        .language-selector .btn {
            margin-right: 10px;
        }

        .btn.active {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>SACO List Converter</h1>
        <div class="language-selector mrgn-bttm-md mrgn-tp-lg">
            <button id="btnEnglish" class="btn btn-primary active">English</button>
            <button id="btnFrench" class="btn btn-default">French</button>
            <button id="btn-copy-code" class="btn btn-default">Copy code</button>
        </div>
        <input type="file" id="upload" accept=".xlsx,.xls" />
        <label for="output">Generated HTML Code:</label>
        <textarea id="output" readonly></textarea>
    </div>

    <script>
        let currentLanguage = 'en';

        document.getElementById('btnEnglish').addEventListener('click', function () {
            currentLanguage = 'en';
            this.classList.add('active');
            this.classList.remove('btn-default');
            this.classList.add('btn-primary');
            document.getElementById('btnFrench').classList.remove('active');
            document.getElementById('btnFrench').classList.remove('btn-primary');
            document.getElementById('btnFrench').classList.add('btn-default');
            processFile();
        });

        document.getElementById('btnFrench').addEventListener('click', function () {
            currentLanguage = 'fr';
            this.classList.add('active');
            this.classList.remove('btn-default');
            this.classList.add('btn-primary');
            document.getElementById('btnEnglish').classList.remove('active');
            document.getElementById('btnEnglish').classList.remove('btn-primary');
            document.getElementById('btnEnglish').classList.add('btn-default');
            processFile();
        });

        // Copies the code in the text area
        document.getElementById("btn-copy-code").addEventListener("click", function() {
            const textarea = document.getElementById("output");
            textarea.select();
            try {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    // Visual feedback that copy was successful
                    const originalText = this.textContent;
                    this.textContent = "Copied!";
                    setTimeout(() => {
                        this.textContent = originalText;
                    }, 2000);
                });
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        });

        let lastUploadedFile = null;

        document.getElementById('upload').addEventListener('change', function (e) {
            lastUploadedFile = e.target.files[0];
            processFile();
        });

        function processFile() {
            const file = lastUploadedFile;
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {
                        type: 'array'
                    });

                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, {
                        header: 1
                    });

                    const grouped = {};

                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        const department = currentLanguage === 'en' ? (row[0] || "Unknown Department") : (row[1] || "Ministère inconnu");
                        const acronym = currentLanguage === 'en' ? (row[2] || "") : (row[3] || "");
                        let application = currentLanguage === 'en' ? (row[5] || "Unknown Application") : (row[6] || "Application inconnue");
                        application = application.replace(/\\/g, "/").replace(/\s*\/\s*/g, " / ");

                        const firstName = row[8] || "";
                        const lastName = row[7] || "";
                        const phonePart1 = row[9] || "";
                        const phonePart2 = row[10] || "";
                        const extension = row[11] || "";
                        const cityRaw = row[4] || "";
                        const email = row[12] || "";
                        const notes = row[13] || "";
                        const city = cityRaw.charAt(0).toUpperCase() + cityRaw.slice(1).toLowerCase();

                        const phoneRaw = `${phonePart1}${phonePart2}`;
                        let formattedPhone = phoneRaw;
                        if (/^\d{10}$/.test(phoneRaw)) {
                            formattedPhone = `${phoneRaw.slice(0,3)}-${phoneRaw.slice(3,6)}-${phoneRaw.slice(6)}`;
                        } else if (phonePart1 || phonePart2) {
                            formattedPhone = `${phonePart1}${phonePart1 && phonePart2 ? "-" : ""}${phonePart2}`;
                        }
                        if (extension.trim()) {
                            formattedPhone += `#${extension.trim()}`;
                        }

                        let contactHTML = `                                ${firstName} ${lastName}<br>\n`;
                        if (formattedPhone.trim()) {
                            contactHTML += `                                ${formattedPhone}`;
                            contactHTML += cityRaw.trim() ? `<br>\n` : `\n`;
                        }
                        if (cityRaw.trim()) {
                            contactHTML += `                                <span class="small">${city}</span>\n`;
                        }

                        const contactItem = `                            <li>\n${contactHTML}                            </li>\n`;

                        if (!grouped[department]) grouped[department] = {};
                        if (!grouped[department][application]) {
                            grouped[department][application] = {
                                contacts: [],
                                email: "",
                                notes: ""
                            };
                        }

                        grouped[department][application].contacts.push(contactItem);
                        if (notes && !grouped[department][application].notes) {
                            grouped[department][application].notes = notes.trim();
                        }
                        if (email && !grouped[department][application].email) {
                            grouped[department][application].email = email.trim();
                        }
                    }

                    const uiText = {
                        en: {
                            expandAll: "Expand all",
                            collapseAll: "Collapse all",
                            notes: "Notes",
                            email: "Email"
                        },
                        fr: {
                            expandAll: "Développer tout",
                            collapseAll: "Réduire tout",
                            notes: "Notes",
                            email: "Courriel"
                        }
                    };

                    let html = `
<div class="btn-group pull-right mrgn-bttm-md mrgn-lft-sm">
    <button class="btn btn-default wb-toggle mrgn-rght-sm" data-toggle="{&quot;selector&quot;: &quot;details&quot;, &quot;parent&quot;: &quot;#saco-list&quot;, &quot;type&quot;: &quot;on&quot;}" type="button">${uiText[currentLanguage].expandAll}</button>
    <button class="btn btn-default wb-toggle" data-toggle="{&quot;selector&quot;: &quot;details&quot;, &quot;parent&quot;: &quot;#saco-list&quot;, &quot;type&quot;: &quot;off&quot;}" type="button">${uiText[currentLanguage].collapseAll}</button>
</div>\n`;

                    html += `<ul class="list-unstyled wb-filter lst-spcd" data-wb-filter="{&quot;selector&quot;:&quot;summary&quot;, &quot;hdnparentuntil&quot;: &quot;ul&quot;}" id="saco-list">\n`;

                    let deptAcronyms = {};
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        const dept = currentLanguage === 'en' ? (row[0] || "") : (row[1] || "");
                        const acronym = currentLanguage === 'en' ? (row[2] || "") : (row[3] || "");
                        if (dept && acronym) {
                            deptAcronyms[dept] = acronym;
                        }
                    }

                    for (const dept in grouped) {
                        const acronym = deptAcronyms[dept] || "";

                        html += `    <li>\n`;
                        html += `        <details class="panel panel-default brdr-0 mrgn-bttm-md">\n`;
                        html += `            <summary class="panel-heading brdr-0"><span class="h4 mrgn-lft-sm">${dept}</span>${acronym ? ` <abbr class="small text-muted"><strong>(${acronym})</strong></abbr>` : ``}</summary>\n`;

                        for (const app in grouped[dept]) {
                            const appData = grouped[dept][app];
                            html += `            <section class="brdr-bttm panel-body">\n`;
                            html += `                <div class="row">\n`;
                            html += `                    <div class="col-xs-12 col-sm-2">\n`;
                            html += `                        <h4 class="h5 mrgn-tp-0">\n`;
                            html += `                            ${app}\n`;
                            html += `                        </h4>\n`;
                            html += `                    </div>\n`;
                            html += `                    <div class="col-xs-12 col-sm-10">\n`;
                            if (appData.notes) {
                                html += `                        <p><strong>${uiText[currentLanguage].notes}:</strong> ${appData.notes}</p>\n`;
                            }
                            if (appData.email) {
                                html += `                        <p><strong>${uiText[currentLanguage].email}:</strong> <a href="mailto:${appData.email}">${appData.email}</a></p>\n`;
                            }
                            html += `                        <ul class="lst-spcd colcount-md-3">\n`;
                            html += appData.contacts.join("");
                            html += `                        </ul>\n`;
                            html += `                    </div>\n`;
                            html += `                </div>\n`;
                            html += `            </section>\n`;
                        }

                        html += `        </details>\n`;
                        html += `    </li>\n`;
                    }

                    html += `</ul>\n`;
                    document.getElementById('output').value = html;

                } catch (err) {
                    document.getElementById('output').value = `Error reading file: ${err.message}`;
                }
            };

            reader.onerror = function () {
                document.getElementById('output').value = "File could not be read.";
            };

            reader.readAsArrayBuffer(file);
        }
    </script>

</body>

</html>
